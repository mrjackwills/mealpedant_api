
networks:
  mealpedant-net:
    name: mealpedant-net
services:
  mealpedant_postgres:
    image: mealpedant_postgres:2.2.0
    container_name: mealpedant_postgres
    hostname: mealpedant_postgres
    command: >
      postgres
       -c autovacuum_vacuum_scale_factor=0.1
       -c autovacuum_analyze_scale_factor=0.05
       -c autovacuum_vacuum_cost_limit=1000
       -c checkpoint_completion_target=0.9
       -c checkpoint_timeout=15min
       -c effective_cache_size=768MB
       -c effective_io_concurrency=100
       -c log_checkpoints=on
       -c maintenance_work_mem=64MB
       -c max_connections=50
       -c max_parallel_workers=2
       -c max_parallel_workers_per_gather=2
       -c max_wal_size=4GB
       -c min_wal_size=1GB
       -c random_page_cost=1.1
       -c shared_buffers=256MB
       -c temp_buffers=8MB
       -c wal_buffers=16MB
       -c wal_compression=on
       -c work_mem=8MB
    build:
      context: /workspaces/backend
      dockerfile: ./docker/dockerfile/postgres.Dockerfile
    env_file: ./env/.postgres.env
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    ipc: private
    restart: always
    shm_size: 256MB
    volumes:
      - /ramdrive/mealpedant/pg_data:/pg_data
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - mealpedant-net
    healthcheck:
      test: ["CMD", "/healthcheck/health_postgres.sh"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024MB
  mealpedant_redis:
    image: mealpedant_redis:2.2.0
    container_name: mealpedant_redis
    hostname: mealpedant_redis
    build:
      context: /workspaces/backend
      dockerfile: ./docker/dockerfile/redis.Dockerfile
    env_file: ./env/.redis.env
    volumes:
      - /ramdrive/mealpedant/redis_data:/redis_data
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    ipc: private
    restart: always
    ports:
      - 127.0.0.1:6379:6379
    networks:
      - mealpedant-net
    healthcheck:
      test: ["CMD", "/healthcheck/health_redis.sh"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 32M
  mealpedant_api:
    image: mealpedant_api:2.2.0
    container_name: mealpedant_api
    hostname: mealpedant_api
    build:
      context: /workspaces/backend
      dockerfile: docker/dockerfile/api.Dockerfile
    volumes:
      - /ramdrive/mealpedant:/logs
      - /ramdrive/mealpedant/backups:/backups
      - /ramdrive/mealpedant/redis_data:/redis_data:ro
      - /workspaces/backend/docker/env:/app_env:ro
      - /workspaces/backend/location_local:/static/public/public:ro
      - /workspaces/backend/location_local/static/converted:/converted
      - /workspaces/backend/location_local/static/original:/original
    ports:
        - "127.0.0.1:8898:8898"
        - "127.0.0.1:8899:8899"
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    ipc: private
    restart: always
    networks:
      - mealpedant-net
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD", "/healthcheck/health_api.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      mealpedant_postgres:
        condition: service_healthy
      mealpedant_redis:
        condition: service_healthy